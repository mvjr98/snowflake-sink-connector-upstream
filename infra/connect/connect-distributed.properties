# Connect worker for the local compose stack.
#
# Kafka 4.1 on purpose: it is the version the connector compiles against (connect-api 4.1.2),
# so what runs here is what runs in production.
bootstrap.servers=broker:29092
group.id=kconnect-local

# Flat JSON on both sides: no schema registry, no envelope. The Debezium profile overrides
# these per connector with the Avro converter.
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=false
value.converter.schemas.enable=false

offset.storage.topic=_connect-offsets
offset.storage.replication.factor=1
config.storage.topic=_connect-configs
config.storage.replication.factor=1
status.storage.topic=_connect-status
status.storage.replication.factor=1

# The sink reports its Snowflake progress on every commit, so keep the cycle short enough to
# watch it happen.
offset.flush.interval.ms=10000

listeners=HTTP://0.0.0.0:8083
rest.advertised.host.name=connect

plugin.path=/opt/kafka/plugins
