apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: kconnect
  annotations:
    strimzi.io/use-connector-resources: "true"
  labels:
    strimzi.io/cluster: kconnect

spec:
  version: 3.7.1
  replicas: 1
  bootstrapServers: host.minikube.internal:9093

  # The v4 connector's SDK extracts a ~29 MiB Rust core (cyclone_shared.so) into
  # java.io.tmpdir and dlopen()s it. Strimzi's /tmp is a memory-backed emptyDir defaulting to
  # 5Mi, so the extraction fails with "No space left on device". Pick one of the two options
  # below - both were verified on a k3d cluster running Strimzi 0.43 and OpenJDK 17.
  #
  # Option A (default here): give /tmp room. Works on any cluster, costs ~29 MiB of pod memory.
  template:
    pod:
      tmpDirSizeLimit: 128Mi

  # Option B: extract onto disk instead, costing no pod memory. Only for clusters that already
  # mount a writable volume - v3 writes its staging CSVs to /mnt/data, so where v3 runs this
  # path exists. Point it at the mount itself: the JVM does not create java.io.tmpdir, and a
  # missing directory fails with NoSuchFileException.
  #
  # The SDK reads no directory setting of its own and calls Files.createTempDirectory(prefix),
  # which resolves through StaticProperty - frozen at VM start. So this has to be a startup
  # flag; System.setProperty from the connector is ignored. Note it moves the temp directory
  # for the whole JVM, every plugin included (v3 is unaffected: it uses tmp_data_folder).
  #
  # jvmOptions:
  #   javaSystemProperties:
  #     - name: java.io.tmpdir
  #       value: /mnt/data

  logging:
    type: inline
    loggers:
      connect.root.logger.level: INFO
      log4j.logger.br.com.datastreambrasil.v3: DEBUG

  config:
    # default config [strimzi]
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
    internal.key.converter: org.apache.kafka.connect.json.JsonConverter
    internal.value.converter: org.apache.kafka.connect.json.JsonConverter
    internal.key.converter.schemas.enable: false
    internal.value.converter.schemas.enable: false

    # config connect cluster
    group.id: connect-cluster-v2
    offset.storage.topic: connect-cluster-offsets-v2
    config.storage.topic: connect-cluster-configs-v2
    status.storage.topic: connect-cluster-status-v2
    config.storage.replication.factor: -1
    offset.storage.replication.factor: -1
    status.storage.replication.factor: -1

    # config producer
    producer.compression.type: lz4
    producer.linger.ms: 50
    producer.acks: 1

    # config consumer
    consumer.auto.offset.reset: earliest
    # read external secrets
    config.providers: secrets
    config.providers.secrets.class: io.strimzi.kafka.KubernetesSecretConfigProvider

  # plugins
  build:
    output:
      type: docker
      image: ttl.sh/strimzi:1h
    plugins:
      - name: jars-for-avro
        artifacts:
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/kafka-connect-avro-converter/7.9.1/kafka-connect-avro-converter-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/kafka-connect-avro-data/7.9.1/kafka-connect-avro-data-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/kafka-avro-serializer/7.9.1/kafka-avro-serializer-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/kafka-schema-registry-client/7.9.1/kafka-schema-registry-client-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/kafka-schema-serializer/7.9.1/kafka-schema-serializer-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/kafka-schema-converter/7.9.1/kafka-schema-converter-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/common-config/7.9.1/common-config-7.9.1.jar
          - type: jar
            url: https://packages.confluent.io/maven/io/confluent/common-utils/7.9.1/common-utils-7.9.1.jar
          - type: jar
            url: https://repo1.maven.org/maven2/org/apache/avro/avro/1.12.0/avro-1.12.0.jar
      - name: debezium-sqlserver-connector
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-sqlserver/2.7.0.Final/debezium-connector-sqlserver-2.7.0.Final-plugin.tar.gz
      - name: snowflake-sink-connector-v3
        artifacts:
          - type: jar
            url: https://repo1.maven.org/maven2/net/snowflake/snowflake-jdbc/3.21.0/snowflake-jdbc-3.21.0.jar
          - type: jar
            url: https://github.com/datastreambrasil/snowflake-sink-connector/releases/download/v3.9.7/snowflake-sink-connector-3.9.7.jar
          - type: jar
            url: https://github.com/datastreambrasil/smt/releases/download/v1.0.2/smt-1.0.2.jar

      # v4 (Snowpipe Streaming). The jar is ~155 MB: it shades snowflake-jdbc and carries the
      # SDK's Rust core for every platform, so no separate snowflake-jdbc artifact is needed.
      #
      # That Rust core is loaded over JNI and needs glibc >= 2.26. The Strimzi base image is
      # UBI-based, so it works - an Alpine/musl base would not.
      - name: snowflake-sink-connector-v4
        artifacts:
          - type: jar
            # resolves once v4.0.4 is tagged in this repository, which cuts the release
            url: https://github.com/datastreambrasil/snowflake-sink-connector/releases/download/v4.0.4/snowflake-sink-connector-4.0.4.jar
          # keep only if your connector configs actually use these transforms
          - type: jar
            url: https://github.com/datastreambrasil/smt/releases/download/v1.0.2/smt-1.0.2.jar